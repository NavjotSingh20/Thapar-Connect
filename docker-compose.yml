services:
  postgres:
    image: postgres:16-alpine
    container_name: thapar_connect_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-thapar_connect}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-thapar_connect}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - thapar_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thapar_connect_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-thapar_connect}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      SERVER_PORT: ${SERVER_PORT:-8080}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      APP_JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      APP_JWT_ACCESS_TOKEN_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-900000}
      APP_JWT_REFRESH_TOKEN_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      APP_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-mock-google-client-id.apps.googleusercontent.com}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-mock-google-client-id.apps.googleusercontent.com}
      ALLOW_MOCK_TOKENS: ${ALLOW_MOCK_TOKENS:-false}
      CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost}
      STORAGE_LOCAL_DIR: /app/uploads
      STORAGE_BASE_URL: ${STORAGE_BASE_URL:-/api/v1/storage}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-LOCAL}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - thapar_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: thapar_connect_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - thapar_network

volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  thapar_network:
    driver: bridge
